<!DOCTYPE html>
<!-- Layout shared by every page (pages choose it with "layout: default").
     GitHub Pages builds the site with Jekyll and puts each page's content in the
     <main> element below. Front matter used by the pages:
       title        Page name, shown in the browser tab (none on the home page)
       description  Summary for search results and link previews
       hero         true shows the large header with photo and profile icons
       permalink    Address of the page, e.g. /publications/ -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} – {% endif %}Luca Pasetto</title>
    <meta name="description" content="{{ page.description }}">
    <link rel="canonical" href="https://lucapasetto.github.io{{ page.url }}">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#2f251f">

    <!-- Link previews (LinkedIn, Slack, email, ...) -->
    <meta property="og:type" content="{% if page.url == '/' %}profile{% else %}website{% endif %}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} – {% endif %}Luca Pasetto">
    <meta property="og:description" content="{{ page.description }}">
    <meta property="og:url" content="https://lucapasetto.github.io{{ page.url }}">
    <meta property="og:image" content="https://lucapasetto.github.io/small_photo300_200.jpg">
    <meta property="og:image:alt" content="Photo of Luca Pasetto">
    <meta name="twitter:card" content="summary">
{% if page.url == '/' %}
    <meta property="profile:first_name" content="Luca">
    <meta property="profile:last_name" content="Pasetto">

    <!-- Links to sections of the old one-page site, such as /#publications, open the new pages -->
    <script>
        const movedSections = { '#publications': '/publications/', '#teaching': '/teaching/', '#history': '/history/', '#contact': '/contact/' };
        const openMovedSection = () => { if (movedSections[location.hash]) location.replace(movedSections[location.hash]); };
        openMovedSection();
        window.addEventListener('hashchange', openMovedSection);
    </script>

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Luca Pasetto",
        "url": "https://lucapasetto.github.io/",
        "image": "https://lucapasetto.github.io/small_photo300_200.jpg",
        "jobTitle": "Postdoctoral Researcher",
        "affiliation": { "@type": "CollegeOrUniversity", "name": "University of Luxembourg" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Università degli Studi di Verona" },
        "knowsAbout": ["Legal Knowledge Representation and Reasoning", "Automated Reasoning", "Explainable AI", "Deontic Logic and Normative Systems"],
        "sameAs": [
            "https://orcid.org/0000-0003-1036-1718",
            "https://scholar.google.com/citations?user=Vckm_4AAAAAJ",
            "https://dblp.org/pid/231/2635.html",
            "https://www.scopus.com/authid/detail.uri?authorId=57205376048",
            "https://www.researchgate.net/profile/Luca-Pasetto",
            "https://www.linkedin.com/in/luca-pasetto-865421114/"
        ]
    }
    </script>
{% endif %}

    <!-- Dependencies (Bootstrap's JavaScript only powers the collapsible menu on small screens) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous" defer></script>
    <link href="/style.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">
{% if page.hero %}
    <header class="site-header text-center py-5">
        <img src="/photo_600x400.jpg" class="rounded" alt="Luca Pasetto" id="small-photo" width="300" height="200">
        <h1>Luca Pasetto</h1>
        <p class="lead">Postdoctoral researcher at the University of Luxembourg</p>
        <ul class="profile-links list-inline mb-0">
            <li class="list-inline-item"><a href="https://orcid.org/0000-0003-1036-1718" title="ORCID" aria-label="ORCID"><svg class="icon" aria-hidden="true"><use href="/icons.svg#orcid"></use></svg></a></li>
            <li class="list-inline-item"><a href="https://scholar.google.com/citations?user=Vckm_4AAAAAJ&amp;hl=en" title="Google Scholar" aria-label="Google Scholar"><svg class="icon" aria-hidden="true"><use href="/icons.svg#google-scholar"></use></svg></a></li>
            <li class="list-inline-item"><a href="https://dblp.org/pid/231/2635.html" title="dblp" aria-label="dblp"><svg class="icon" aria-hidden="true"><use href="/icons.svg#dblp"></use></svg></a></li>
            <li class="list-inline-item"><a href="https://www.scopus.com/authid/detail.uri?authorId=57205376048" title="Scopus" aria-label="Scopus"><svg class="icon" aria-hidden="true"><use href="/icons.svg#scopus"></use></svg></a></li>
            <li class="list-inline-item"><a href="https://www.researchgate.net/profile/Luca-Pasetto" title="ResearchGate" aria-label="ResearchGate"><svg class="icon" aria-hidden="true"><use href="/icons.svg#researchgate"></use></svg></a></li>
            <li class="list-inline-item"><a href="https://www.linkedin.com/in/luca-pasetto-865421114/" title="LinkedIn" aria-label="LinkedIn"><svg class="icon" aria-hidden="true"><use href="/icons.svg#linkedin"></use></svg></a></li>
        </ul>
    </header>
{% endif %}

    <nav class="navbar navbar-expand-md sticky-top site-nav" data-bs-theme="dark">
        <div class="container">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link nav-home{% if page.url == '/' %} active{% endif %}" href="/" title="Home" aria-label="Home"{% if page.url == '/' %} aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="/icons.svg#home"></use></svg></a></li>
                    <li class="nav-item"><a class="nav-link{% if page.url == '/publications/' %} active{% endif %}" href="/publications/"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a></li>
                    <li class="nav-item"><a class="nav-link{% if page.url == '/teaching/' %} active{% endif %}" href="/teaching/"{% if page.url == '/teaching/' %} aria-current="page"{% endif %}>Teaching</a></li>
                    <li class="nav-item"><a class="nav-link{% if page.url == '/history/' %} active{% endif %}" href="/history/"{% if page.url == '/history/' %} aria-current="page"{% endif %}>Academic History</a></li>
                    <li class="nav-item"><a class="nav-link{% if page.url == '/contact/' %} active{% endif %}" href="/contact/"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">
{{ content }}
    </main>

    <footer class="site-footer text-center py-3">
        &copy; Luca Pasetto
    </footer>
</body>

</html>
